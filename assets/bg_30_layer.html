<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent !important;
  }
  svg {
    width: 1920px;
    height: 1080px;
    display: block;
  }
</style>
</head>
<body>
  <svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#f5f8ff" stop-opacity="0.90"/>
        <stop offset="50%" stop-color="#b8cae8" stop-opacity="0.68"/>
        <stop offset="100%" stop-color="#132240" stop-opacity="0.18"/>
      </linearGradient>
      <linearGradient id="redRibbon" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#DA291C" stop-opacity="0"/>
        <stop offset="50%" stop-color="#DA291C" stop-opacity="0.62"/>
        <stop offset="100%" stop-color="#DA291C" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="blueRibbon" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#004170" stop-opacity="0"/>
        <stop offset="50%" stop-color="#2078e8" stop-opacity="0.50"/>
        <stop offset="100%" stop-color="#004170" stop-opacity="0"/>
      </linearGradient>
      <radialGradient id="halo" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22"/>
        <stop offset="55%" stop-color="#DA291C" stop-opacity="0.10"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
      </radialGradient>
      <filter id="softGlow" x="-25%" y="-25%" width="150%" height="150%">
        <feGaussianBlur stdDeviation="26" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>

    <!-- Soft atmospheric halo & PSG Hechter vertical light columns -->
    <circle cx="960" cy="540" r="520" fill="url(#halo)"/>
    <rect x="850" y="20" width="220" height="1040" fill="url(#blueRibbon)" opacity="0.55"/>
    <rect x="942" y="40" width="36" height="1000" fill="url(#redRibbon)" opacity="0.80"/>
    <circle cx="960" cy="540" r="415" fill="none" stroke="rgba(220,235,255,0.12)" stroke-width="1.5"/>

    <!-- Monumental editorial numeral 30 spaced cleanly so it frames behind shoulders -->
    <text x="960" y="795"
          text-anchor="middle"
          font-family="'Nimbus Sans Narrow', 'Liberation Sans Narrow', sans-serif"
          font-weight="900"
          font-size="780"
          letter-spacing="12"
          fill="url(#metalGrad)"
          stroke="rgba(255,255,255,0.32)"
          stroke-width="3"
          filter="url(#softGlow)">30</text>
  </svg>
</body>
</html>
