name: Publish Release Asset

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag name
        required: true
        default: v1.0.0
      asset_branch:
        description: Branch holding rendered release artifact
        required: true
        default: release-payload

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout artifact payload
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.asset_branch }}

      - name: Create GitHub Release and attach MP4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.tag }}" messi-psg-30-1080p60.mp4 \
            --target main \
            --title "Messi PSG (#30) — 1080p60 Beat-Synced Montage (${{ inputs.tag }})" \
            --notes "20.57s 1920x1080@60fps PSG-era (2021–2023) Lionel Messi montage rendered via ModernGL 4-pass GLSL shaders, OpenCV DISOpticalFlow (up to 120fps slow-mo), AI parallax cutouts, and beat-locked DSP audio mix (-10.3 LUFS, -0.9 dBFS true peak, 1.73ms mean beat onset error)."
